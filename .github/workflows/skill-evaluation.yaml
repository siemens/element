name: Element Skill Evaluation

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'OpenCode API-key provider ID (for example anthropic or openai)'
        type: string
        required: true
      model:
        description: 'Model ID within the selected provider'
        type: string
        required: true
      base_url:
        description: 'Optional provider API base URL; leave blank to use the provider default'
        type: string
      repeats:
        description: 'Independent runs per case (3 or more to inspect stability)'
        type: choice
        options: ['1', '3', '5']
        default: '1'

permissions:
  contents: read

concurrency:
  group: skill-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Node.js and pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@lithium
          cache: true
          install: false
      - name: Install evaluation tooling
        run: pnpm install --filter @siemens/element-skill-eval --frozen-lockfile
      - name: Install Chromium for browser verification tests
        run: pnpm --filter @siemens/element-skill-eval exec playwright install --with-deps chromium
      - name: Check browser verifier and OpenCode skill source integration
        run: pnpm --filter @siemens/element-skill-eval test:integration
      - name: Prepare Element starter
        id: fixture
        run: pnpm skills:eval:prepare
        env:
          SIEMENS_NPM_TOKEN: ${{ secrets.SIEMENS_NPM_TOKEN }}
      - name: Evaluate Element skill with Promptfoo
        run: pnpm skills:eval --repeat '${{ inputs.repeats }}'
        env:
          SKILL_EVAL_API_KEY: ${{ secrets.SKILL_EVAL_API_KEY }}
          SKILL_EVAL_PROVIDER: ${{ inputs.provider }}
          SKILL_EVAL_MODEL: ${{ inputs.model }}
          SKILL_EVAL_BASE_URL: ${{ inputs.base_url }}
          SKILL_EVAL_FIXTURE: ${{ steps.fixture.outputs.directory }}
          SKILL_EVAL_OUTPUT: ${{ github.workspace }}/tools/skill-eval/results/${{ github.run_id }}
      - name: Upload evaluation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: element-skill-evaluation-${{ github.run_id }}
          path: tools/skill-eval/results
          retention-days: 90
          if-no-files-found: warn
