<si-info-page
  titleText="Access request pending"
  description="Awaiting administrator approval. A confirmation will be sent by email."
>
  <span class="icon-size icon-stack si-info-image">
    <si-icon class="status-success" icon="element-shield-filled" />
    <si-icon class="status-success-contrast" [icon]="face" />
  </span>
  <div class="si-info-actions">
    <button
      type="button"
      class="btn btn-secondary me-6 mb-6"
      (click)="face = 'element-state-face-very-unhappy'"
    >
      Contact administrator
    </button>
    <button
      type="button"
      class="btn btn-secondary me-6 mb-6"
      (click)="face = 'element-state-face-confused'"
    >
      Cancel request
    </button>

    <button
      type="button"
      class="btn btn-primary me-6 mb-6"
      (click)="face = 'element-state-face-very-happy'"
    >
      Back to application
    </button>
  </div>
</si-info-page>
