<div class="p-6">
  <div class="position-relative w-100 border p-6">
    <div class="row">
      <div class="col mb-6">
        <button
          si-action-card
          type="button"
          class="card-size"
          selectable
          disabled
          heading="Natural Gas Usage"
          (selectedChange)="onCardSelect($event, 'card1')"
        >
          <p class="card-body card-text" body>
            Some quick example text to build on the card title and make up the bulk of the card's
            content.
          </p>
        </button>
      </div>
      <div class="col mb-6">
        <button
          si-action-card
          type="button"
          class="card-size"
          selectable
          heading="FS20"
          (selectedChange)="onCardSelect($event, 'card2')"
        >
          <si-icon headerIcon icon="element-fire" class="icon me-3" />
          <div body class="card-body card-text">
            <p class="ms-9">Too much wood is burning in the hot summer.</p>
            <div class="d-flex">
              <si-icon icon="element-fire-sensor" class="icon me-3" />
              <p>Use Siemens sensors to detect fire and save the planet.</p>
            </div>
          </div>
        </button>
      </div>
      <div class="col mb-6">
        <button
          #card
          si-action-card
          type="button"
          class="card-size"
          selectable
          heading="Overflows"
          (selectedChange)="onCardSelect($event, 'card3')"
        >
          <div body class="card-body card-text">
            Some quick example text to build on the card title and make up the bulk of the card's
            content.
          </div>
        </button>
      </div>
    </div>
    <div class="row">
      <div class="col mb-6">
        <button
          #card
          si-action-card
          type="button"
          class="card-size"
          heading="Overflows"
          selectable
          imgSrc="assets/images/beach.jpg"
          imgDir="vertical"
          imgAlt="Beach in Greece"
          imgObjectFit="cover"
          (selectedChange)="onCardSelect($event, 'card4')"
        >
          <div body class="card-body card-text">
            Select this card to explore the beach in Greece.
          </div>
        </button>
      </div>

      <div class="col mb-6">
        <button
          si-action-card
          type="button"
          class="card-size accent-caution"
          selectable
          heading="Caution accent"
          (selectedChange)="onCardSelect($event, 'card5')"
        >
          <p class="card-body card-text" body>
            Some quick example text to build on the card title and make up the bulk of the card's
            content.
          </p>
        </button>
      </div>

      <div class="col mb-6">
        <button
          si-action-card
          type="button"
          class="card-size accent-info"
          selectable
          heading="Info accent"
          (selectedChange)="onCardSelect($event, 'card6')"
        >
          <p class="card-body card-text" body>
            Some quick example text to build on the card title and make up the bulk of the card's
            content.
          </p>
        </button>
      </div>
    </div>
  </div>
</div>
