<h3 class="mb-6">Default size</h3>
<div class="d-flex flex-wrap align-items-center gap-4">
  @for (variant of variants; track variant.name) {
    @if (variant.name === 'primary' || variant.name === 'secondary') {
      <span class="badge mx-0" [class]="'bg-' + variant.name">
        <si-icon class="icon" [icon]="variant.icon" />
        <span class="text-truncate">Badge {{ variant.name }}</span>
      </span>
    } @else {
      <si-badge class="mx-0" [type]="variant.name" [icon]="variant.icon">
        Badge {{ variant.name }}
      </si-badge>
    }
  }
</div>
