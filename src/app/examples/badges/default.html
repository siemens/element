<h3 class="mb-6">Default size</h3>
<div class="d-flex flex-wrap align-items-center gap-4 mb-8">
  @for (variant of variants; track variant) {
    <span class="badge mx-0" [class]="'bg-' + variant">Badge {{ variant }}</span>
  }
</div>

<h3 class="mb-6">Small size</h3>
<div class="d-flex flex-wrap align-items-center gap-4">
  @for (variant of variants; track variant) {
    <span class="badge badge-sm mx-0" [class]="'bg-' + variant">Badge {{ variant }}</span>
  }
</div>
