<div class="d-flex flex-wrap align-items-center gap-4">
  <si-icon
    role="status"
    aria-label="Notifications"
    class="icon badge-dot"
    [icon]="icons.elementAlarmFilled"
  />
  <span class="text-nowrap" role="status" aria-label="8 notifications">
    <si-icon class="icon" [icon]="icons.elementAlarmFilled" />
    <span class="badge-text" aria-hidden="true">8</span>
  </span>
  <span class="text-nowrap" role="status" aria-label="More than 99 notifications">
    <si-icon class="icon" [icon]="icons.elementAlarmFilled" />
    <span class="badge-text" aria-hidden="true">99+</span>
  </span>
</div>
