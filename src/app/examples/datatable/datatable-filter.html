<div class="p-5 h-100">
  <ngx-datatable
    class="table-element"
    siDatatableInteraction
    columnMode="force"
    [rows]="rows()"
    [rowHeight]="tableConfig.rowHeightSmall"
    [footerHeight]="0"
    [ghostLoadingIndicator]="dataResource.isLoading()"
    [(offset)]="offset"
  >
    <ngx-datatable-column name="Name" prop="name" [sortable]="true">
      <ng-template ngx-datatable-header-actions>
        <si-table-search-text [formField]="filterField" (valueChange)="resetOffset()" />
      </ng-template>
    </ngx-datatable-column>
    <ngx-datatable-column name="Role" prop="role" [sortable]="true" />
    <ngx-datatable-column name="Company" prop="company" [sortable]="true" />
    <si-empty-state empty-content icon="element-users" heading="No users to display" />
  </ngx-datatable>
</div>
