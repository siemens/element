<div class="container-fluid">
  <div class="row">
    <div class="col">
      <table class="table" [class.table-sm]="useSmallTable" [class.table-hover]="useHover">
        <thead>
          <tr>
            <th scope="col" class="text-center">
              <input
                type="checkbox"
                class="form-check-input float-none align-middle"
                aria-label="all selected"
              />
            </th>
            <th scope="col" class="text-center"
              ><si-icon
                aria-label="Expand all"
                class="icon"
                icon="element-expand-all"
                role="button"
            /></th>
            <th scope="col" class="text-center">Type</th>
            <th scope="col">Data point</th>
            <th scope="col" class="text-center">Quality</th>
            <th scope="col" class="text-center">Mode</th>
            <th scope="col" class="text-center">Event</th>
            <th scope="col">Value</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="text-center">
              <input
                type="checkbox"
                class="form-check-input float-none align-middle"
                aria-label="selected"
              />
            </td>
            <td class="text-center">
              <button
                type="button"
                class="btn btn-tertiary btn-circle"
                title="open dropdown"
                aria-label="open dropdown"
              >
                <si-icon [icon]="icons.elementDown2" />
              </button>
            </td>
            <td class="text-center">
              <si-icon class="icon" [icon]="icons.elementConfigValue" />
            </td>
            <td>
              <span class="si-h5">Cooling coil device mode</span><br /><span
                class="si-body text-secondary"
                >B1'Flr_1'RSegm1'HVAC</span
              >
            </td>
            <td class="text-center">
              <si-icon class="icon text-secondary" [icon]="icons.elementTransient" />
            </td>
            <td class="text-center">
              <si-icon class="icon status-warning" [icon]="icons.elementMaintenanceFilled" />
            </td>
            <td class="text-center">
              <si-icon class="icon" [icon]="icons.elementAlarm" />
            </td>
            <td class="si-body">
              <input type="text" class="form-control" value="50%" aria-label="value" disabled />
            </td>
          </tr>
          <tr>
            <td class="text-center">
              <input
                type="checkbox"
                class="form-check-input float-none align-middle"
                aria-label="selected"
              />
            </td>
            <td class="text-center">
              <button
                type="button"
                class="btn btn-tertiary btn-circle"
                title="open dropdown"
                aria-label="open dropdown"
              >
                <si-icon [icon]="icons.elementDown2" />
              </button>
            </td>
            <td class="text-center">
              <si-icon class="icon" [icon]="icons.elementPhysicalInput" />
            </td>
            <td class="si-h5">Cooling coil cooling request</td>
            <td class="text-center"></td>
            <td class="text-center">
              <si-icon class="icon status-danger" [icon]="icons.elementManualFilled" />
            </td>
            <td class="text-center"></td>
            <td class="si-body">
              <select class="form-select" aria-label="value" disabled>
                <option value="">Control Mode</option>
              </select>
            </td>
          </tr>
          <tr class="table-active">
            <td class="text-center">
              <input
                type="checkbox"
                class="form-check-input float-none align-middle"
                aria-label="selected"
              />
            </td>
            <td class="text-center">
              <button
                type="button"
                class="btn btn-tertiary btn-circle"
                title="open dropdown"
                aria-label="open dropdown"
              >
                <si-icon [icon]="icons.elementDown2" />
              </button>
            </td>
            <td class="text-center">
              <si-icon class="icon" [icon]="icons.elementPhysicalInput" />
            </td>
            <td class="si-h5">Cooling coil dehumidification request</td>
            <td class="text-center"></td>
            <td class="text-center">
              <si-icon class="icon status-warning" [icon]="icons.elementManualFilled" />
            </td>
            <td class="text-center">
              <si-icon class="icon status-danger" [icon]="icons.elementAlarmFilled" />
            </td>
            <td class="si-body">
              <input type="text" class="form-control" value="50%" aria-label="value" disabled />
            </td>
          </tr>
          <tr>
            <td class="text-center">
              <input
                type="checkbox"
                class="form-check-input float-none align-middle"
                aria-label="selected"
              />
            </td>
            <td class="text-center">
              <button
                type="button"
                class="btn btn-tertiary btn-circle"
                title="open dropdown"
                aria-label="open dropdown"
              >
                <si-icon [icon]="icons.elementDown2" />
              </button>
            </td>
            <td class="text-center">
              <si-icon class="icon" [icon]="icons.elementCalculatedValue" />
            </td>
            <td class="si-h5">Cooling coil available for cooling</td>
            <td class="text-center">
              <si-icon class="icon status-danger" [icon]="icons.elementCancelFilled" />
            </td>
            <td class="text-center"></td>
            <td class="text-center">
              <span class="icon icon-stack">
                <si-icon class="status-danger" [icon]="icons.elementAlarmBackgroundFilled" />
                <si-icon class="text-secondary" [icon]="icons.elementAlarmTick" />
              </span>
            </td>
            <td class="si-body">
              <input type="text" class="form-control" value="50%" aria-label="value" disabled />
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="row e2e-ignore">
    <div class="col">
      <div class="card">
        <div class="card-header">Settings</div>
        <div class="card-body">
          <div class="mb-6 row">
            <label class="col-form-label col-md-2" for="use-small-table">Condensed rows</label>
            <div class="col-md-10">
              <si-form-item label="Check to apply the table-sm class for condensed row height.">
                <input type="checkbox" class="form-check-input" [(ngModel)]="useSmallTable" />
              </si-form-item>
            </div>
          </div>
          <div class="mb-6 row">
            <label class="col-form-label col-md-2" for="use-hover">Hoverable rows</label>
            <div class="col-md-10">
              <si-form-item label="Check to apply the table-hover class.">
                <input type="checkbox" class="form-check-input" [(ngModel)]="useHover" />
              </si-form-item>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
