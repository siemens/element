<div class="h-100 si-layout-fixed-height">
  <div>
    <button type="button" class="btn btn-primary mb-4" (click)="showDetails = !showDetails">
      Toggle details
    </button>
  </div>
  <si-split class="si-layout-fixed-height" [orientation]="orientation">
    <si-split-part
      heading="Filters"
      collapsible="to-start"
      class="background-1"
      size="20"
      unit="fr"
      [actions]="[{ iconClass: 'element-edit', click: logEvent, tooltip: 'edit' }]"
      [minSize]="100"
    >
      <p class="p-4 text-secondary">Split Part #1</p>
    </si-split-part>

    <si-split-part
      heading="Employees"
      collapsible="to-start"
      class="background-1"
      size="60"
      unit="fr"
    >
      <div class="si-layout-fixed-height justify-content-center background-neutral">
        <p class="text-center text-inverse">Split Part with resizable content!</p>
      </div>
    </si-split-part>

    @if (showDetails) {
      <si-split-part
        heading="Details"
        collapsible="to-end"
        class="background-1"
        size="20"
        unit="fr"
      >
        <p class="p-4 text-secondary">Split Part #3</p>
      </si-split-part>
    }
  </si-split>

  <p class="mt-8">
    <button type="button" class="btn btn-primary me-6" (click)="orientation = 'vertical'"
      >Set to vertical</button
    >
    <button type="button" class="btn btn-primary me-6" (click)="orientation = 'horizontal'"
      >Set to horizontal</button
    >
  </p>
</div>
