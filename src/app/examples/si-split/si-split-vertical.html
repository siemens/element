<si-split orientation="vertical" style="height: 500px">
  <si-split-part
    heading="Filters"
    collapsible="to-start"
    class="background-1"
    size="20"
    unit="fr"
    [actions]="[{ iconClass: 'element-edit', click: logEvent, tooltip: 'edit' }]"
    [minSize]="250"
  >
    <p class="p-4 text-secondary">Split Part #1</p>
  </si-split-part>

  <si-split-part
    heading="Employees"
    collapsible="to-start"
    class="background-1"
    size="60"
    unit="fr"
  >
    <p class="p-4 text-secondary">Split Part #2</p>
  </si-split-part>

  <si-split-part heading="Details" collapsible="to-end" class="background-1" size="20" unit="fr">
    <p class="p-4 text-secondary">Split Part #3</p>
  </si-split-part>
</si-split>
