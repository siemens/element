<si-split orientation="horizontal" stateId="split-mixed" style="height: 300px">
  <si-split-part
    heading="Filters"
    stateId="filters"
    collapsible="to-start"
    class="background-1"
    size="200"
    unit="px"
    [actions]="[
      { iconClass: 'element-edit', click: logEvent, tooltip: 'edit' },
      { iconClass: 'element-delete', click: logEvent, tooltip: 'delete' }
    ]"
    (stateChange)="logEvent(format('left', $event))"
  >
    <p class="p-4 text-secondary">Split Part #1</p>
  </si-split-part>

  <si-split-part heading="Employees" stateId="employees" class="background-1" size="1" unit="fr">
    <si-split orientation="vertical" stateId="vertical-split">
      <si-split-part
        stateId="middle-top"
        class="background-1"
        size="100"
        unit="px"
        [showHeader]="false"
        (stateChange)="logEvent(format('middle', $event))"
      >
        <p class="p-4 text-secondary">Split Part #2.1</p>
      </si-split-part>
      <si-split-part
        stateId="middle-bottom"
        class="background-1"
        size="1"
        unit="fr"
        [showHeader]="false"
      >
        <p class="p-4 text-secondary">Split Part #2.2</p>
      </si-split-part>
    </si-split>
  </si-split-part>

  <si-split-part
    heading="Details"
    stateId="details"
    collapsible="to-end"
    class="background-1"
    size="200"
    unit="px"
    (stateChange)="logEvent(format('right', $event))"
  >
    <p class="p-4 text-secondary">Split Part #3</p>
  </si-split-part>
</si-split>
