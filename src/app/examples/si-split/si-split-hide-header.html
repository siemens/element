<si-split orientation="horizontal" style="height: 500px">
  <si-split-part
    heading="Filters"
    collapsible="to-start"
    class="background-1"
    size="30"
    unit="fr"
    [actions]="[{ iconClass: 'element-edit', click: logEvent, tooltip: 'edit' }]"
    [minSize]="150"
  >
    <p class="p-4 text-secondary">Split Part #1</p>
  </si-split-part>

  <si-split-part
    heading="Details"
    size="70"
    unit="fr"
    [actions]="[{ iconClass: 'element-edit', click: logEvent, tooltip: 'edit' }]"
  >
    <si-split orientation="vertical">
      <si-split-part
        heading="Upper"
        collapsible="to-start"
        class="background-1"
        size="60"
        unit="fr"
        [showHeader]="false"
      >
        <p class="p-4 text-secondary">Split Part #2</p>
      </si-split-part>
      <si-split-part
        heading="Lower"
        collapsible="to-start"
        class="background-1"
        size="40"
        unit="fr"
        [showHeader]="false"
      >
        <p class="p-4 text-secondary">Split Part #3</p>
      </si-split-part>
    </si-split>
  </si-split-part>
</si-split>
