<div class="p-2">
  <si-chat-input
    placeholder="Enter a command, question or topic…"
    disclaimer="The content is AI generated. Always verify the information for accuracy."
    accept="image/*,.pdf,.doc,.docx,.txt,.xlsx,.csv"
    sendButtonLabel="Send Message"
    sendButtonIcon="element-send-filled"
    attachFileLabel="Attach files"
    [allowAttachments]="true"
    [maxFileSize]="5242880"
    [maxLength]="280"
    [autoFocus]="false"
    [value]="inputValue()"
    [sending]="sending()"
    [disabled]="disabled()"
    [interruptible]="interruptible()"
    [attachments]="preAttachedFiles"
    [actions]="actions"
    [secondaryActions]="secondaryActions"
    [models]="models()"
    [modelSelectionHasFilter]="modelSettings().search"
    [modelSelectionActions]="modelActions()"
    [(selectedModel)]="selectedModel"
    (send)="onMessageSent($event)"
    (fileError)="onFileError($event)"
    (interrupt)="onInterrupt()"
  >
    <!-- Custom actions via ng-content slot -->
    <button
      type="button"
      class="btn btn-tertiary-ghost btn-icon"
      title="Insert emoji"
      (click)="logEvent('Emoji picker clicked')"
    >
      <si-icon icon="element-face-very-happy" />
    </button>
  </si-chat-input>
  <div class="d-flex flex-wrap gap-5 mt-8">
    <label class="form-check-label">
      <input type="checkbox" class="form-check-input me-4" [formField]="modelForm.search" />
      Show model search
    </label>
    <label class="form-check-label">
      <input type="checkbox" class="form-check-input me-4" [formField]="modelForm.descriptions" />
      Show model descriptions
    </label>
  </div>
</div>
