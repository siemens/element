<div class="p-2">
  <si-ai-message
    actionParam="message-1"
    [actions]="actions"
    [secondaryActions]="secondaryActions"
    [loading]="false"
    [sources]="sources"
    (sourceClicked)="logEvent($event)"
  >
    <si-markdown
      [markdown]="content"
      [options]="markdownOptions"
      [citations]="inlineSources"
      (extensionEvent)="logEvent($event)"
    />
  </si-ai-message>

  <div class="mt-5">
    <si-ai-message [loading]="true" />
  </div>
</div>
