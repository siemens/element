<si-search-field>
  <input
    type="search"
    class="form-control search-bar-input"
    aria-label="Search states"
    placeholder="Search states…"
    [formField]="searchField"
    [siTypeahead]="states"
  />
</si-search-field>
<p class="mt-5">Debounced search term: {{ debouncedSearchTerm.value() }}</p>
