<si-menu style="display: inline-block !important">
  <si-menu-item [icon]="icons.elementCut">Cut</si-menu-item>
  <si-menu-item [icon]="icons.elementCopy">Copy</si-menu-item>
  <si-menu-item [cdkMenuTriggerFor]="pasteTypes">Paste as</si-menu-item>
  <si-menu-item [icon]="icons.elementDelete">Delete</si-menu-item>
  <si-menu-divider />
  <si-menu-item>Rename</si-menu-item>
  <si-menu-item disabled>Share</si-menu-item>
  <si-menu-item disabled>Archive</si-menu-item>
  <si-menu-item-checkbox [checked]="showArchived()" (triggered)="toggleArchived()">
    Show archived
  </si-menu-item-checkbox>
  <si-menu-divider />
  <si-menu-header>View as</si-menu-header>
  <si-menu-item-radio [checked]="view() === 'table'" (triggered)="view.set('table')">
    Table
  </si-menu-item-radio>
  <si-menu-item-radio [checked]="view() === 'cards'" (triggered)="view.set('cards')">
    Cards
  </si-menu-item-radio>
  <si-menu-item-radio [checked]="view() === 'timeline'" (triggered)="view.set('timeline')">
    Timeline
  </si-menu-item-radio>
  <si-menu-divider />
  <si-menu-item badge="3" badgeColor="info" [icon]="icons.elementChat">Comments</si-menu-item>
  <si-menu-item [icon]="icons.elementRestore">Version history</si-menu-item>
  <si-menu-divider />
  <si-menu-item [icon]="icons.elementExport" [cdkMenuTriggerFor]="fileTypes"
    >Export as</si-menu-item
  >
</si-menu>

<ng-template #pasteTypes>
  <si-menu>
    <si-menu-item>Plain text</si-menu-item>
    <si-menu-item>Keep formatting</si-menu-item>
  </si-menu>
</ng-template>

<ng-template #fileTypes>
  <si-menu>
    <si-menu-item>Image</si-menu-item>
    <si-menu-item>File</si-menu-item>
    <si-menu-item [cdkMenuTriggerFor]="otherFileTypes">Other</si-menu-item>
  </si-menu>
</ng-template>

<ng-template #otherFileTypes>
  <si-menu>
    <si-menu-item>Zip</si-menu-item>
  </si-menu>
</ng-template>
