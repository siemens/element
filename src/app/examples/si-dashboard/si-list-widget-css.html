<div class="row">
  <div class="col-4 mb-6">
    <si-card
      class="h-100"
      heading="Heading"
      actionBarViewType="expanded"
      [primaryActions]="primaryActions"
    >
      <div class="d-flex flex-column flex-grow-1 flex-shrink-1" body>
        <div class="px-6 py-4">
          <si-search-bar showIcon colorVariant="base-0" />
        </div>
        <ul class="list list-divider">
          @for (building of buildings; track $index) {
            <li class="list-item">
              <span class="list-item-indicator badge bg-default">{{ building.alarms }}</span>
              <span class="list-item-title">{{ building.name }}</span>
              <div class="list-item-primary-action d-flex align-items-center gap-4">
                <span>{{ building.value }}</span>
                <button
                  type="button"
                  class="btn btn-icon btn-tertiary element-export"
                  aria-label="Action on building"
                  (click)="logEvent('Action on building')"
                ></button>
              </div>
            </li>
          }
        </ul>
      </div>

      <div class="card-footer" footer>
        <a [siLink]="simplLink">
          {{ simplLink.title }}
          <i aria-hidden="true" class="link-icon link-end element-right-2 flip-rtl"></i>
        </a>
      </div>
    </si-card>
  </div>
</div>
