<div class="container-fluid">
  <div class="row gy-5">
    <div class="col">
      <si-card heading="Reactive Form">
        <div class="card-body" body>
          <form class="responsive-form-col-layout" [formGroup]="form" (ngSubmit)="save()">
            <si-form-fieldset label="FORM.ROLE" inline>
              <button
                si-help-button
                type="button"
                siHelpTitle="FORM.INPUT_HELP_TITLE"
                siHelpContent="FORM.INPUT_HELP_DESCRIPTION"
                >{{ 'FORM.ROLE_MORE_INFORMATION' | translate }}</button
              >
              <si-form-item label="FORM.ENGINEER">
                <input
                  type="radio"
                  formControlName="role"
                  value="ENGINEER"
                  id="role-engineer"
                  class="form-check-input"
                />
              </si-form-item>
              <si-form-item label="FORM.INSTALLER">
                <input
                  type="radio"
                  formControlName="role"
                  value="INSTALLER"
                  id="role-installer"
                  class="form-check-input"
                />
              </si-form-item>
            </si-form-fieldset>
            <si-form-item label="FORM.NAME">
              <input
                type="text"
                id="name"
                class="form-control"
                formControlName="name"
                required
                minlength="3"
                pattern="^[A-Z].*"
                [readonly]="readonly"
              />
              <button
                si-help-button
                type="button"
                siHelpTitle="FORM.INPUT_HELP_TITLE"
                siHelpContent="FORM.INPUT_HELP_DESCRIPTION"
                >{{ 'FORM.NAME_MORE_INFORMATION' | translate }}</button
              >
            </si-form-item>
            <si-form-item label="FORM.DESCRIPTION">
              <input
                type="text"
                id="description"
                class="w-100 form-control"
                formControlName="description"
                [readonly]="readonly"
              />
            </si-form-item>
            <si-form-item label="FORM.PHONE_NUMBER">
              <si-phone-number-input
                class="form-control"
                formControlName="phoneNumber"
                defaultCountry="CH"
                placeholderForSearch="FORM.SEARCH"
                selectCountryAriaLabel="FORM.SELECT_COUNTRY"
                [supportedCountries]="['AU', 'CH', 'DE', 'FK', 'IN', 'US']"
                [readonly]="readonly"
              />
            </si-form-item>
            <si-form-item label="FORM.BIRTHDAY">
              <si-calendar-button class="w-100">
                <input
                  type="text"
                  id="birthday"
                  class="w-100 form-control"
                  autocomplete="off"
                  formControlName="birthday"
                  siDatepicker
                  required
                  [readonly]="readonly"
                />
              </si-calendar-button>
            </si-form-item>
            <si-form-item label="FORM.TRAVEL_DATE">
              <si-date-range
                id="travelDate"
                required
                formControlName="travelDate"
                [readonly]="readonly"
              />
            </si-form-item>
            <si-form-item label="FORM.ARRIVAL">
              <si-timepicker
                id="arrival"
                formControlName="arrival"
                required
                [hideLabels]="true"
                [readonly]="readonly"
              />
            </si-form-item>
            <si-form-item label="FORM.DEPARTURE">
              <si-timepicker
                id="departure"
                formControlName="departure"
                required
                [hideLabels]="true"
                [readonly]="readonly"
              />
            </si-form-item>
            <si-form-item label="FORM.CLASS">
              <si-select
                class="form-control"
                formControlName="serviceClass"
                id="form-class-label"
                [options]="optionsList"
                [readonly]="readonly"
              />
            </si-form-item>
            <si-form-item label="FORM.FELLOW_PASSENGERS">
              <si-number-input
                class="form-control"
                formControlName="fellowPassengers"
                [readonly]="readonly"
              />
            </si-form-item>
            <si-form-fieldset label="FORM.ACCEPT_TERMS">
              <si-form-item label="FORM.ACCEPT_TERMS_DESCRIPTION">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="termsAccepted"
                  formControlName="termsAccepted"
                  required
                />
                <button
                  si-help-button
                  type="button"
                  siHelpTitle="FORM.INPUT_HELP_TITLE"
                  siHelpContent="FORM.INPUT_HELP_DESCRIPTION"
                  >{{ 'FORM.ACCEPT_TERMS_MORE_INFORMATION' | translate }}</button
                >
              </si-form-item>
              <si-form-item label="FORM.ACCEPT_NO_PRIVACY">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="privacyDeclined"
                  formControlName="privacyDeclined"
                  required
                />
              </si-form-item>
            </si-form-fieldset>
            <div class="d-flex justify-content-end mt-6">
              <button type="button" class="btn btn-secondary me-6" (click)="cancel()"
                >Cancel</button
              >
              <button type="submit" class="btn btn-primary">Save</button>
            </div>
          </form>
        </div>
      </si-card>
    </div>
    <app-form-debug
      [formData]="form.getRawValue()"
      [submitted]="submitted"
      [validationStatus]="form.status"
      [(state)]="debugState"
    />
  </div>
</div>
