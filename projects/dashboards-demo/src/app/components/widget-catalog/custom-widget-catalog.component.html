<div class="modal-header">
  <span class="modal-title">Custom Catalog</span>
  <button
    type="button"
    class="btn btn-circle btn-tertiary-ghost element-cancel"
    aria-label="Close"
    (click)="onCancel()"
  >
  </button>
</div>
<div class="modal-body text-pre-wrap text-break overflow-y-auto widget-list">
  <div class="list">
    <button
      type="button"
      class="list-item list-item-action"
      [class.active]="selectedWidgets()[0] === myDescriptor"
      (click)="selectedWidgets.set([myDescriptor])"
    >
      <si-icon
        class="list-item-indicator icon"
        [icon]="myDescriptor.iconClass || icons.elementSpecialObject"
      />
      <span class="list-item-title">{{ myDescriptor.name | translate }}</span>
      <span class="list-item-description">{{ myDescriptor.description | translate }}</span>
    </button>
  </div>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="onCancel()">{{
    'DASHBOARD.WIDGET_LIBRARY.CANCEL' | translate
  }}</button>
  <button
    type="button"
    class="btn btn-primary"
    [disabled]="!selectedWidgets()[0]"
    (click)="onAddWidget()"
    >{{ 'DASHBOARD.WIDGET_LIBRARY.ADD' | translate }}</button
  >
</div>
