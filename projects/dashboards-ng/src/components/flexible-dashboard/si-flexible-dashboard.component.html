<si-dashboard #dashboard [sticky]="true">
  <!--
    Do not replace the default title below with [heading]="pageTitle()" on si-dashboard.
    Forwarding the header slot always fills it, even if no custom header is supplied. Angular then
    never renders the heading fallback of si-dashboard, so the default title is rendered here.
  -->
  <ng-container header>
    @if (isDashboardVisible()) {
      <ng-content select="[header]">
        <ng-container *ngTemplateOutlet="pageHeader" />
      </ng-content>
    } @else {
      <ng-container *ngTemplateOutlet="pageHeader" />
    }
  </ng-container>
  <si-dashboard-toolbar
    #toolbar
    menubar
    [class.d-none]="!isDashboardVisible()"
    [primaryEditActions]="(primaryEditActions$ | async) ?? []"
    [secondaryEditActions]="(secondaryEditActions$ | async) ?? []"
    [disabled]="(grid.isLoading | async) ?? false"
    [hideEditButton]="hideEditButton()"
    [showEditButtonLabel]="showEditButtonLabel()"
    [grid]="grid"
    [(editable)]="editable"
    (save)="grid.save()"
  >
    <ng-content select="[filters-slot]" filters-slot />
  </si-dashboard-toolbar>

  <div dashboard class="d-contents">
    <si-grid
      #grid
      [class.d-none]="!isDashboardVisible()"
      [gridConfig]="config()?.grid"
      [dashboardId]="dashboardId()"
      [widgetCatalog]="widgetCatalog()"
      [hideProgressIndicator]="hideProgressIndicator()"
      [widgetInstanceEditorDialogComponent]="widgetInstanceEditorDialogComponent()"
      [emitWidgetInstanceEditEvents]="true"
      [(editable)]="editable"
      (isModified)="onModified($event)"
      (widgetInstanceEdit)="editWidgetInstance($event)"
    >
      <ng-content select="[empty-state]" empty-state />
    </si-grid>
    <ng-container #catalogHost />
  </div>
</si-dashboard>

<ng-template #pageHeader>
  @if (pageTitle()) {
    <div class="si-layout-header">
      <h2 class="si-layout-title si-layout-top-element">{{ pageTitle() | translate }}</h2>
    </div>
  }
</ng-template>
