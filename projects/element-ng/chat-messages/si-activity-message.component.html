<div class="activity-message">
  <button
    type="button"
    class="activity-header focus-inside"
    [id]="headerId"
    [attr.aria-expanded]="expanded()"
    [attr.aria-controls]="contentId"
    (click)="expanded.set(!expanded())"
  >
    <span class="activity-marker" aria-hidden="true">
      @if (state() === 'running') {
        <si-loading-spinner class="state-marker" />
      } @else {
        <si-icon class="state-marker" [icon]="markerIcon()" />
      }
      <si-icon
        class="disclosure-marker"
        [icon]="expanded() ? icons.elementDown2 : icons.elementRight2"
      />
    </span>
    <span class="activity-label">{{ label() | translate }}</span>
    <span class="visually-hidden">{{ stateLabel() | translate }}</span>
  </button>

  <div class="activity-content" role="region" [id]="contentId" [attr.aria-labelledby]="headerId">
    @if (expanded()) {
      <div class="content-motion" animate.enter="content-enter" animate.leave="content-leave">
        <div class="content-inner">
          <ng-content />
        </div>
      </div>
    }
  </div>
</div>
