<si-chat-message alignment="start" actionsPosition="bottom" [loading]="loading()">
  @if (content()) {
    <span class="text-pre-wrap">{{ content() }}</span>
  } @else {
    <ng-content />
  }

  @let src = sources();
  @if (actions().length > 0 || secondaryActions().length > 0 || src?.length) {
    <si-chat-message-actions
      class="ai-message-actions"
      siChatMessageAction
      [actions]="actions()"
      [secondaryActions]="secondaryActions()"
      [actionParam]="actionParam()"
      [secondaryActionsLabel]="secondaryActionsLabel()"
    >
      @if (src?.length) {
        <si-source-chip
          showIcon
          showLabel
          [sources]="src"
          (sourceClicked)="sourceClicked.emit($event)"
        />
      }
    </si-chat-message-actions>
  }
</si-chat-message>
