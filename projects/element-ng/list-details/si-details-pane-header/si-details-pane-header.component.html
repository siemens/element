@if ((!hasLargeSize() && !hideBackButton()) || title()) {
  <div class="title-subgroup">
    @if (!hasLargeSize() && !hideBackButton()) {
      <button
        #backButton
        type="button"
        class="btn btn-ghost btn-icon align-self-center ms-2"
        [attr.aria-label]="backButtonText() | translate"
        (click)="backClicked()"
      >
        <si-icon class="icon" [icon]="icons.elementBack" />
      </button>
    }
    @if (title()) {
      <span class="si-details-header-title si-body px-6">{{ title() | translate }}</span>
    }
  </div>
}
<ng-content />
