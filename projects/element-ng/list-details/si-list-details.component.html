@if (!disableResizing() && hasLargeSize()) {
  <si-split
    class="w-100 flex-grow-1"
    orientation="horizontal"
    [stateId]="stateId()"
    (sizesChange)="onSplitSizesChange($event)"
  >
    <si-split-part
      [unit]="listUnit()"
      [size]="splitSizes()[0]"
      [showHeader]="false"
      [minSize]="minListSize()"
      [stateId]="listStateId()"
    >
      <ng-container *ngTemplateOutlet="listTemplate" />
    </si-split-part>
    <si-split-part
      unit="fr"
      [size]="splitSizes()[1]"
      [showHeader]="false"
      [minSize]="minDetailsSize()"
      [stateId]="detailsStateId()"
    >
      <ng-container *ngTemplateOutlet="detailsTemplate" />
    </si-split-part>
  </si-split>
} @else {
  <div
    #listDetailsContainer
    [class]="`list-details d-flex flex-row ${detailsExpandedAnimation()}`"
    [class.gap-6]="hasLargeSize()"
    (transitionend)="detailsExpandedAnimationDone($event)"
  >
    <ng-container *ngTemplateOutlet="listTemplate" />
    <ng-container *ngTemplateOutlet="detailsTemplate" />
  </div>
}

<ng-template #listTemplate>
  <ng-content select="si-list-pane" />
</ng-template>

<ng-template #detailsTemplate>
  <ng-content select="si-details-pane" />
</ng-template>
