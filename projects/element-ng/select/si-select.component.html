<si-select-input
  cdkOverlayOrigin
  [labelledby]="labelledby()"
  [optionTemplate]="selectedValueTemplate() ?? optionTemplate()"
  [ariaLabel]="ariaLabel()"
  [placeholder]="placeholder()"
  [attr.aria-describedby]="errormessageId()"
/>

<ng-template si-select-dropdown contentType="listbox">
  @if (!hasFilter()) {
    <si-select-list
      [baseId]="id()"
      [optionTemplate]="optionTemplate()"
      [groupTemplate]="groupTemplate()"
      [labelledby]="labelledby()"
      [actionsTemplate]="actionsTemplate()"
      (closeOverlay)="close()"
    />
  } @else {
    <si-select-list-has-filter
      [baseId]="id()"
      [filterPlaceholder]="filterPlaceholder()"
      [noResultsFoundLabel]="noResultsFoundLabel()"
      [optionTemplate]="optionTemplate()"
      [groupTemplate]="groupTemplate()"
      [labelledby]="labelledby()"
      [actionsTemplate]="actionsTemplate()"
      (closeOverlay)="close()"
    />
  }
</ng-template>
