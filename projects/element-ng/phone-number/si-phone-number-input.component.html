<div
  class="btn-group w-100 d-flex shadow-none border-0"
  [class.disabled]="disabled()"
  [class.readonly]="readonly()"
  [attr.aria-disabled]="disabled()"
>
  <button
    siPhoneNumberInputSelect
    class="dropdown-toggle d-flex align-items-center ms-n4 my-n4 py-2 px-4 border-0"
    type="button"
    [id]="id() + '-country'"
    [disabled]="disabled()"
    [readonly]="readonly()"
    [labelledby]="id() + '-aria-label'"
    [errormessageId]="errormessageId()"
    [scrollStrategy]="scrollStrategy()"
    [options]="countryList()"
    [value]="selectedCountry()"
    (valueChange)="countryInput($event)"
    (openChange)="countrySelectOpenChange($event)"
    (focus)="countryFocused.set(true)"
    (blur)="countryFocused.set(false)"
  >
    <span class="visually-hidden" [id]="id() + '-aria-label'">{{
      selectCountryAriaLabel() | translate
    }}</span>
    <span
      aria-hidden="true"
      [class]="`fi fi-${(selectedCountry()?.isoCode | lowercase) ?? 'xx'}`"
    ></span>
    <span class="si-body" [class.ms-4]="!!selectedCountry()" [id]="id() + '-country-combobox'">
      @if (selectedCountry(); as selectedCountry) {
        <span class="visually-hidden">{{ selectedCountry.name }}</span>
        +{{ selectedCountry.countryCode }}
      }
    </span>
    <si-icon class="icon dropdown-caret" [icon]="icons.elementDown2" />

    <ng-template si-select-dropdown contentType="listbox">
      <si-select-list-has-filter
        [style.min-width.px]="dropdownWidth()"
        [baseId]="id()"
        [filterPlaceholder]="placeholderForSearch()"
        [noResultsFoundLabel]="searchNoResultsFoundLabel()"
        [optionTemplate]="optionTemplate"
        (closeOverlay)="countrySelect().close()"
      />
    </ng-template>
    <ng-template #optionTemplate let-option>
      <span aria-hidden="true" [class]="`fi me-5 fi-${(option.value.isoCode | lowercase)}`"></span>
      {{ option.value.name }} +{{ option.value.countryCode }}
    </ng-template>
  </button>
  <input
    #phoneInput
    type="tel"
    class="ms-4 border-0 p-0 focus-none shadow-none flex-grow-1 phone-number"
    [value]="phoneInputValue()"
    [attr.aria-label]="phoneNumberAriaLabel() | translate"
    [attr.aria-describedby]="errormessageId()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [readonly]="readonly()"
    (input)="input($event)"
    (blur)="blur()"
  />
</div>
