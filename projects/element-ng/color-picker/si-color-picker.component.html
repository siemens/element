<button
  #colorInputBox
  #trigger="cdkOverlayOrigin"
  cdkOverlayOrigin
  class="input-color-box"
  type="button"
  aria-haspopup="grid"
  [class.is-open]="isOverlayOpen()"
  [attr.aria-expanded]="isOverlayOpen()"
  [attr.aria-controls]="isOverlayOpen() ? paletteId : null"
  [attr.aria-label]="
    ariaLabel() ? (ariaLabel() | translate: { color: color() ?? '' }) : (color() ?? null)
  "
  [disabled]="disabled()"
  (keydown.arrowDown)="openOverlay()"
  (blur)="blur()"
  (click)="openOverlay()"
>
  <div
    class="inside-box"
    [style.background-color]="color() ? 'var(--' + color() + ')' : null"
  ></div>
</button>

<ng-template
  cdkConnectedOverlay
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  [cdkConnectedOverlayHasBackdrop]="true"
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="isOverlayOpen()"
  [cdkConnectedOverlayScrollStrategy]="scrollStrategy()"
  [cdkConnectedOverlayFlexibleDimensions]="true"
  (backdropClick)="overlayDetach()"
  (detach)="overlayDetach()"
>
  <div
    ngGrid
    class="colors shadow-3 rounded-2 background-1 p-4 mt-1 d-flex flex-column gap-4"
    selectionMode="explicit"
    colWrap="continuous"
    enableSelection
    [id]="paletteId"
    [attr.aria-label]="colorPaletteAriaLabel() | translate"
    (keydown.tab)="overlayDetach()"
  >
    @for (row of colorRows(); track $index) {
      <div ngGridRow class="colors-row gap-4">
        @for (paint of row; track $index) {
          <div
            #swatch="ngGridCell"
            ngGridCell
            class="color-box"
            [attr.aria-label]="paint"
            [style.background]="'var(--' + paint + ')'"
            [selected]="color() === paint"
            (selectedChange)="swatchSelectedChange(swatch, paint, $event)"
          >
            @if (color() === paint) {
              <si-icon class="icon text-inverse p-1" [icon]="icons.elementOk" />
            }
          </div>
        }
      </div>
    }
  </div>
</ng-template>
