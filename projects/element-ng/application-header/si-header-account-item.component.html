<si-avatar
  size="small"
  color="0"
  aria-hidden="true"
  [altText]="name()"
  [initials]="initials()"
  [imageUrl]="imageUrl()"
/>
<div #itemTitle class="item-title" [class.visually-hidden]="visuallyHideTitle()">
  <ng-content>{{ accountItemLabel() | translate: { name: name() } }}</ng-content>
</div>
@if (badgeValue()) {
  <div class="badge-text">{{ badgeValue() }}</div>
}
@if (dropdownTrigger) {
  <si-icon class="dropdown-caret" [icon]="icons.elementDown2" />
}
