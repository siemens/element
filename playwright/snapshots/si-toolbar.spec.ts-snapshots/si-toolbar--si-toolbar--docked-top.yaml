- link "Jump to Main content"
- link "Jump to Navigation"
- banner:
  - link "Siemens logo":
    - /url: /
  - heading "Graphics editor" [level=1]
  - button "Account of Lars Vegas"
- navigation:
  - button "Collapse" [expanded]
  - button "Floating"
  - button "Docked"
- main:
  - heading "Docked toolbar" [level=2]
  - paragraph: A compact toolbar docks to the workspace edge for persistent access.
  - text: Placement
  - group "Placement":
    - radio "Start"
    - text: Start
    - radio "End"
    - text: End
    - radio "Top" [checked]
