    - radio "Bottom"
    - text: Bottom
  - switch "Dock to application layout"
  - text: Dock to application layout
  - toolbar "Editor toolbar":
    - group "Tools":
      - button "Pen"
      - button "Move" [pressed]
      - button "Line"
      - button "Text"
    - group "History":
      - button "Undo"
      - button "Redo" [disabled]