- heading "Signal form" [level=2]
- group "Role*":
  - text: ""
  - button "More information about the role"
  - radio "Engineer"
  - text: Engineer
  - radio "Installer"
  - text: Installer
- text: Name*
- button "More information about the name"
- textbox "Name*"
- text: Description
- textbox "Description"
- text: Phone number
- group "Phone number":
  - combobox /Select country Switzerland \+\d+/
  - textbox "Enter phone number":
    - /placeholder: 21 234 56 78
- text: Day of birth
- textbox "Day of birth"
- button "Open calendar"
- text: Travel date
- group "Travel date":
  - textbox "Start date"
  - text: "-"
  - textbox "End date"
  - button "Open calendar"
- text: Arrival
- group "Arrival":
  - textbox "Hours":
    - /placeholder: hh
  - textbox "Minutes":
    - /placeholder: mm
  - combobox "Period":
    - option "AM" [selected]
    - option "PM"
- text: Departure
- group "Departure":
  - textbox "Hours":
    - /placeholder: hh
  - textbox "Minutes":
    - /placeholder: mm
  - combobox "Period":
    - option "AM" [selected]
    - option "PM"
- text: Class of service
- combobox "Class of service": First class
- text: Fellow passengers
- spinbutton "Fellow passengers": "0"
- group "Accept terms":
  - text: ""
  - checkbox "I confirm that I accept all and everything*"
  - text: I confirm that I accept all and everything*
  - button "More information about the terms"
  - checkbox "I confirm that I do not care about my privacy*"
  - text: I confirm that I do not care about my privacy*
- button "Cancel"
- button "Save"
- heading "Debugging" [level=2]
- paragraph: "Validation status: INVALID"
- table:
  - rowgroup:
    - row "Model Submitted":
      - columnheader "Model"
      - columnheader "Submitted"
  - rowgroup:
    - 'row "{ \"name\": \"\", \"description\": \"\", \"phoneNumber\": \"\", \"birthday\": \"\", \"travelDate\": {}, \"arrival\": null, \"departure\": null, \"serviceClass\": \"first\", \"role\": \"\", \"fellowPassengers\": 0, \"termsAccepted\": false, \"privacyDeclined\": false } undefined"':
      - 'cell "{ \"name\": \"\", \"description\": \"\", \"phoneNumber\": \"\", \"birthday\": \"\", \"travelDate\": {}, \"arrival\": null, \"departure\": null, \"serviceClass\": \"first\", \"role\": \"\", \"fellowPassengers\": 0, \"termsAccepted\": false, \"privacyDeclined\": false }"'
      - cell "undefined"