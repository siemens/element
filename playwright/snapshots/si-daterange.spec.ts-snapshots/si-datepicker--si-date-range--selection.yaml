- text: Date range
- group "Date range":
  - textbox "Start": /2\/1\/\d+/
  - text: "-"
  - textbox "End": /2\/6\/\d+/
  - button "Open calendar"
- heading "Date range value" [level=4]
- text: "/\\{ \"start\": \"\\d+-\\d+-01T00:\\d+:\\d+\\.000Z\", \"end\": \"\\d+-\\d+-06T00:\\d+:\\d+\\.000Z\" \\}/"
- heading "Validation:" [level=4]
- text: Date range is VALID
- button "Back"
- button "February"
- button /\d+/
- button "Next"
- grid:
  - rowgroup:
    - row "Calendar week Sun Mon Tue Wed Thu Fri Sat":
      - columnheader "Calendar week"
      - columnheader "Sun"
      - columnheader "Mon"
      - columnheader "Tue"
      - columnheader "Wed"
      - columnheader "Thu"
      - columnheader "Fri"
      - columnheader "Sat"
  - rowgroup:
